name: Update data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_consensus.py --top 100 --period MONTH --watch BreakTheBank
      - run: python fetch_consensus.py --top 100 --period MONTH --category SPORTS --out data_sports.json --no-history --skip-resolve
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json data_sports.json history.json calls.json watch.json
          git commit -m "Update data" || exit 0
          git push
